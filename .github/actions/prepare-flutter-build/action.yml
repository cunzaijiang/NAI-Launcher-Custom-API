name: Prepare incremental Flutter build
description: Restore Flutter build caches, resolve dependencies, and generate sources.

inputs:
  flutter-version:
    description: Exact Flutter SDK version used by the repository.
    required: true
  bootstrap-from-source:
    description: Bootstrap the pinned official Flutter tag instead of downloading a release SDK archive.
    required: false
    default: "false"
  cache-namespace:
    description: Prefix used to isolate this repository's build caches.
    required: false
    default: nai
  cache-flutter-sdk:
    description: Cache the Flutter SDK on ephemeral hosted runners.
    required: false
    default: "true"
  cache-pub-dependencies:
    description: Cache Pub packages on ephemeral hosted runners.
    required: false
    default: "true"
  cache-windows-build:
    description: Restore and save Flutter AOT plus native Windows build outputs.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Flutter
      if: inputs.bootstrap-from-source != 'true'
      id: flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable
        cache: ${{ inputs.cache-flutter-sdk }}
        pub-cache: ${{ inputs.cache-pub-dependencies }}
        pub-cache-key: "${{ inputs.cache-namespace }}-flutter-pub-:os:-:channel:-:version:-:arch:-:hash:"

    - name: Checkout official Flutter source
      if: inputs.bootstrap-from-source == 'true'
      shell: pwsh
      env:
        REQUESTED_FLUTTER_VERSION: ${{ inputs.flutter-version }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:REQUESTED_FLUTTER_VERSION -cne '3.47.5') {
          throw 'Source bootstrap is pinned to Flutter 3.47.5.'
        }
        $sdk = Join-Path $env:GITHUB_WORKSPACE 'tool/.tmp/flutter-sdk'
        & git -c core.longpaths=true clone --depth 1 --branch $env:REQUESTED_FLUTTER_VERSION https://github.com/flutter/flutter.git $sdk
        if ($LASTEXITCODE -ne 0) {
          throw 'Unable to clone the pinned official Flutter source.'
        }

    - name: Bootstrap and verify official Flutter source
      if: inputs.bootstrap-from-source == 'true'
      shell: pwsh
      env:
        REQUESTED_FLUTTER_VERSION: ${{ inputs.flutter-version }}
      run: |
        $ErrorActionPreference = 'Stop'
        $expectedVersion = '3.47.5'
        $expectedFramework = '6a19cca56475dbfba1478ee68d7bd0c2ef891da1'
        $expectedEngine = 'af7e796e161ae0bb1ff0758c71a7105418bd9ded'
        if ($env:REQUESTED_FLUTTER_VERSION -ne $expectedVersion) {
          throw "Source bootstrap is pinned to Flutter $expectedVersion."
        }
        $sdk = Join-Path $env:GITHUB_WORKSPACE 'tool/.tmp/flutter-sdk'
        $head = & git -C $sdk rev-parse HEAD
        if ($LASTEXITCODE -ne 0 -or $head -ne $expectedFramework) {
          throw 'Official Flutter framework commit mismatch.'
        }
        $tag = & git -C $sdk rev-parse "refs/tags/${expectedVersion}^{commit}"
        if ($LASTEXITCODE -ne 0 -or $tag -ne $expectedFramework) {
          throw 'Official Flutter release tag mismatch.'
        }
        $engine = (Get-Content -LiteralPath "$sdk/bin/internal/engine.version" -Raw -Encoding UTF8).Trim()
        if ($engine -ne $expectedEngine) {
          throw 'Official Flutter engine pin mismatch.'
        }
        ./scripts/verify_flutter_sources.ps1
        $bin = Join-Path $sdk 'bin'
        Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin -Encoding UTF8
        $env:PATH = "$bin$([IO.Path]::PathSeparator)$env:PATH"
        $flutter = Join-Path $bin $(if ($IsWindows) { 'flutter.bat' } else { 'flutter' })
        # Use this checkout explicitly; Unix runners execute the official Bash entrypoint.
        # Bootstrap separately so first-run progress cannot contaminate machine JSON.
        & $flutter --suppress-analytics --version
        if ($LASTEXITCODE -ne 0) {
          throw 'Official Flutter source bootstrap failed.'
        }
        $machineOutput = & $flutter --suppress-analytics --version --machine
        if ($LASTEXITCODE -ne 0) {
          throw 'Unable to read the bootstrapped Flutter version.'
        }
        $version = ($machineOutput -join "`n") | ConvertFrom-Json
        if ($version.frameworkVersion -ne $expectedVersion -or
            $version.frameworkRevision -ne $expectedFramework -or
            $version.engineRevision -ne $expectedEngine) {
          throw 'Bootstrapped Flutter framework/engine identity mismatch.'
        }
        $machineOutput | Write-Output

    - name: Restore generated-code cache
      uses: actions/cache@v6
      with:
        path: |
          .dart_tool/build
          lib/**/*.g.dart
          lib/**/*.freezed.dart
        key: ${{ inputs.cache-namespace }}-codegen-${{ runner.os }}-${{ inputs.flutter-version }}-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('pubspec.yaml', 'build.yaml', 'lib/**') }}
        restore-keys: |
          ${{ inputs.cache-namespace }}-codegen-${{ runner.os }}-${{ inputs.flutter-version }}-${{ hashFiles('pubspec.lock') }}-

    - name: Restore Flutter and native Windows build cache
      if: inputs.cache-windows-build == 'true'
      uses: actions/cache@v6
      with:
        path: |
          .dart_tool/flutter_build
          build/native_assets
          build/windows
        key: ${{ inputs.cache-namespace }}-windows-build-${{ runner.os }}-${{ inputs.flutter-version }}-${{ hashFiles('pubspec.lock', 'windows/**') }}-${{ hashFiles('pubspec.yaml', 'l10n.yaml', 'lib/**', 'assets/**', 'fonts/**') }}
        restore-keys: |
          ${{ inputs.cache-namespace }}-windows-build-${{ runner.os }}-${{ inputs.flutter-version }}-${{ hashFiles('pubspec.lock', 'windows/**') }}-

    - name: Verify official Flutter dependency sources
      shell: pwsh
      run: ./scripts/verify_flutter_sources.ps1

    - name: Resolve dependencies from cache
      if: steps.flutter.outputs.PUB-CACHE-HIT == 'true'
      shell: pwsh
      run: flutter pub get --enforce-lockfile --offline

    - name: Resolve dependencies from network
      if: steps.flutter.outputs.PUB-CACHE-HIT != 'true'
      shell: pwsh
      run: flutter pub get --enforce-lockfile

    - name: Generate localizations
      shell: pwsh
      run: flutter gen-l10n

    - name: Generate code incrementally
      shell: pwsh
      run: dart run build_runner build --delete-conflicting-outputs
